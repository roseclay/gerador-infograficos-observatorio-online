services:
  gerador-infograficos:
    build: .
    image: gerador-infograficos-observatorio:latest
    environment:
      STREAMLIT_SERVER_BASE_URL_PATH: gerador-infografico
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./workspace:/app/workspace
      - ./output:/app/output
    restart: unless-stopped
